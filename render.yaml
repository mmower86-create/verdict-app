# Render blueprint: stands up BOTH Verdict services free, in one click.
#
# Why this exists: Railway's trial credit ran out (Jul 2026) and removed both
# services. This moves hosting to Render's free tier at $0.
#
# HOW TO USE (Render dashboard):
#   New + > Blueprint > connect the mmower86-create/verdict-app repo > Apply.
#   Render reads this file, creates both services, and prompts for the secret
#   values (everything marked sync:false). Paste them from server/.env.
#
# TRADEOFF: the free web service sleeps after ~15 min idle, so the first request
# after a quiet spell waits 30-60s. Invisible at current traffic volume.

services:
  # ── API (Express) ─────────────────────────────────────────────────────────
  - type: web
    name: verdict-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # CLIENT_URL drives BOTH the CORS origin and the Stripe success/cancel
      # redirect. Set it to the live client URL once the static site is up.
      - key: CLIENT_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # @clerk/express reads these implicitly from env. Both are required even
      # though only the middleware touches them.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # Regenerate this after pointing the Stripe webhook at the new Render URL.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FOUNDER
        sync: false
      - key: STRIPE_PRICE_STANDARD
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false

  # ── Client (static Vite build) ────────────────────────────────────────────
  # Static sites are free on Render and do NOT sleep.
  - type: web
    name: verdict-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # VITE_ vars are baked in at BUILD time, so changing either one requires
      # a redeploy, not just an env edit.
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      # SPA fallback so client-side routes and the Clerk redirect resolve.
      - type: rewrite
        source: /*
        destination: /index.html
